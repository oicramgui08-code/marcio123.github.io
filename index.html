<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Ofertas</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

header {
  background: #020617;
  padding: 20px;
  text-align: center;
  font-size: 26px;
}

.container {
  padding: 15px;
}

.card {
  background: #1e293b;
  margin: 15px 0;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  position: relative;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  background: red;
  padding: 5px 10px;
  border-radius: 6px;
  font-size: 12px;
}

.stars {
  color: gold;
  margin: 5px 0;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 12px;
  background: #22c55e;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.timer {
  color: #facc15;
  font-size: 14px;
  margin-top: 5px;
}

footer {
  text-align: center;
  padding: 20px;
  font-size: 14px;
}
</style>
</head>

<body>

<header>🔥 Tech Ofertas</header>

<div class="container">

<div class="card">
  <span class="badge">🔥 Oferta</span>
  <img src="https://picsum.photos/400/300?1">
  <h2>Fone Bluetooth Premium</h2>
  
  <div class="stars">★★★★★</div>
  
  <div class="timer">⏳ Oferta acaba em: <span id="timer"></span></div>

  <a href="https://meli.la/1nW2s1B" class="btn" target="_blank">Ver oferta</a>
</div>

</div>

<footer>
Este site participa do programa de afiliados
</footer>

<script>
// CONTADOR
let tempo = 600; // 10 minutos

function atualizarTimer() {
  let min = Math.floor(tempo / 60);
  let seg = tempo % 60;
  document.getElementById("timer").innerText = min + ":" + (seg < 10 ? "0" : "") + seg;
  tempo--;
  if (tempo >= 0) setTimeout(atualizarTimer, 1000);
}

atualizarTimer();
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Tech</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #f5f6fa;
}

/* HEADER */
header {
    background: linear-gradient(135deg,#1e90ff,#007acc);
    color: white;
    text-align: center;
    padding: 25px;
}

/* FILTRO */
.filtro {
    display: flex;
    gap: 10px;
    padding: 15px;
    overflow-x: auto;
}

.filtro button {
    border: none;
    background: white;
    padding: 8px 12px;
    border-radius: 20px;
    cursor: pointer;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(160px,1fr));
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 12px;
    padding: 10px;
    box-shadow: 0 5px 12px rgba(0,0,0,0.1);
}

/* BADGE */
.badge {
    position: absolute;
    background: red;
    color: white;
    padding: 4px 8px;
    border-radius: 8px;
    font-size: 10px;
}

/* IMG */
.card img {
    width: 100%;
    height: 140px;
    object-fit: contain;
}

/* PREÇO */
.old { text-decoration: line-through; color: gray; }
.price { color: green; font-weight: bold; }

/* BOTÃO */
.btn {
    display: block;
    background: green;
    color: white;
    text-align: center;
    padding: 8px;
    border-radius: 8px;
    text-decoration: none;
    margin-top: 8px;
}
</style>
</head>

<body>

<header>
<h1>⚡ Nexa Tech</h1>
<p>Ofertas automáticas 🔥</p>
</header>

<div class="filtro" id="filtro"></div>

<div class="grid" id="grid"></div>

<script src="produtos.js"></script>

<script>

const grid = document.getElementById("grid");
const filtro = document.getElementById("filtro");

/* PEGAR CATEGORIAS */
const categorias = [...new Set(produtos.map(p => p.categoria))];

filtro.innerHTML = `<button onclick="mostrar('todos')">Todos</button>` +
categorias.map(c => `<button onclick="mostrar('${c}')">${c}</button>`).join("");

function mostrar(cat){

grid.innerHTML = "";

produtos
.filter(p => cat === 'todos' || p.categoria === cat)
.forEach(p => {

grid.innerHTML += `
<div class="card">

${p.destaque ? `<div class="badge">🔥 TOP</div>` : ""}

<img src="${p.img}">

<h4>${p.nome}</h4>

<div class="old">${p.old}</div>
<div class="price">${p.price}</div>

<a class="btn" href="${p.link}" target="_blank">
Comprar agora
</a>

</div>
`;

});
}

/* INICIAL */
mostrar('todos');

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Nexa Tech - Sua loja de eletrônicos e achados tecnológicos. Confira as melhores ofertas em Smart TVs, projetores, smartphones e acessórios com descontos exclusivos.">
    <meta name="keywords" content="nexa tech, eletrônicos, smart tv, projetor portátil, comprar celular, achados tech, promoções mercado livre, tecnologia">
    <meta name="author" content="Nexa Tech">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="📱 Nexa Tech - Os Melhores Achados em Eletrônicos 📱">
    <meta property="og:description" content="Sua nova vitrine de tecnologia. Os melhores produtos com descontos imperdíveis e segurança!">
    <meta property="og:type" content="website">

    <title>Nexa Tech - Eletrônicos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding-bottom: 40px; }
        header { background: linear-gradient(135deg, #002244, #001122); color: #ffffff; text-align: center; padding: 40px 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        header h1 { font-size: 2.5rem; font-weight: 800; letter-spacing: -1px; }
        header p { color: #00aaff; font-weight: 500; margin-top: 5px; }
        
        /* Banner Temático da Copa */
        .copa-banner { display: block; background: linear-gradient(135deg, #009c3b, #ffdf00); margin: 20px auto; max-width: 1160px; border-radius: 12px; padding: 20px; text-align: center; text-decoration: none; color: #002244; box-shadow: 0 6px 12px rgba(0,0,0,0.15); transition: transform 0.3s; border: 2px solid #009c3b; }
        .copa-banner:hover { transform: scale(1.01); }
        .copa-banner h2 { font-size: 1.6rem; font-weight: 800; }
        .copa-banner p { font-weight: 600; margin-top: 4px; font-size: 1.05rem; color: #004411; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .product-card { background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); display: flex; flex-direction: column; overflow: hidden; border: 1px solid #eef2f5; transition: transform 0.3s; }
        .product-card:hover { transform: translateY(-5px); }
        
        .carousel-container { width: 100%; height: 240px; position: relative; overflow: hidden; background: white; border-bottom: 1px solid #eee; }
        .carousel-track { display: flex; width: 100%; height: 100%; transition: transform 0.3s ease-out; cursor: grab; }
        .carousel-track:active { cursor: grabbing; }
        .carousel-slide { min-width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 15px; }
        .carousel-slide img { max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; }
        .carousel-dots { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
        .dot { width: 8px; height: 8px; background: rgba(0,0,0,0.15); border-radius: 50%; transition: background 0.2s; }
        .dot.active { background: #00aaff; width: 12px; border-radius: 4px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.9); border: 1px solid #ddd; width: 36px; height: 36px; border-radius: 50%; font-weight: bold; font-size: 1.2rem; color: #333; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .prev-btn { left: 8px; }
        .next-btn { right: 8px; }

        .product-info { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-info h3 { font-size: 0.95rem; color: #002244; margin-bottom: 10px; min-height: 44px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 700; }
        .price-container { margin-top: auto; margin-bottom: 15px; }
        .current-price { color: #ff3b30; font-size: 1.45rem; font-weight: 800; }
        .btn-oferta { display: block; text-align: center; background: linear-gradient(135deg, #002244, #001122); color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-add-cart { display: block; text-align: center; background-color: #fff; color: #002244; border: 2px solid #002244; padding: 10px; border-radius: 8px; font-weight: 600; cursor: pointer; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.8rem; }
            .copa-banner h2 { font-size: 1.2rem; }
            .copa-banner p { font-size: 0.9rem; }
            .products-grid { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; }
            .carousel-container { height: 170px; }
            .product-info h3 { font-size: 0.85rem; min-height: 36px; }
            .current-price { font-size: 1.2rem; }
            .nav-btn { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Nexa Tech</h1>
        <p>Sua vitrine inteligente de achados tecnológicos</p>
    </header>

    <div class="container">
        <a href="copa.html" class="copa-banner">
            <h2>🇧🇷 Especial Copa do Manto e Torcida 2026 🇧🇷</h2>
            <p>Smart TVs, Projetores, Camisas do Brasil e muito mais com Descontos Exclusivos! Clique aqui e veja.</p>
        </a>

        <div class="products-grid">
            <div class="product-card">
                <div class="carousel-container">
                    <div class="carousel-track">
                        <div class="carousel-slide"><img src="https://i.ibb.co/v67mmPwn/Screenshot-2026-05-19-18-49-13-710-com-mercadolibre.jpg"></div>
                    </div>
                    <div class="carousel-dots"></div>
                </div>
                <div class="product-info">
                    <h3>Projetor Magcubic Hy310 Smart Full HD 1080p Android 11</h3>
                    <div class="price-container"><div class="current-price">R$ 393,00</div></div>
                    <a href="https://meli.la/2FiNFju" target="_blank" class="btn-oferta">Garantir Desconto</a>
                    <button class="btn-add-cart" onclick="addToCart('Projetor HY310', 'R$ 393,00', 'https://meli.la/2FiNFju')">⭐ Salvar no Carrinho</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Lógica simplificada de carrossel arrastável
        document.querySelectorAll('.product-card').forEach(card => {
            const track = card.querySelector('.carousel-track');
            const slides = Array.from(card.querySelectorAll('.carousel-slide'));
            const dotsContainer = card.querySelector('.carousel-dots');
            if(!track || slides.length === 0) return;
            
            let currentIndex = 0;
            slides.forEach((_, idx) => {
                const dot = document.createElement('div');
                dot.classList.add('dot');
                if(idx === 0) dot.classList.add('active');
                dotsContainer.appendChild(dot);
            });
        });

        function addToCart(name, price, link) {
            let cart = JSON.parse(localStorage.getItem('tech_cart')) || [];
            cart.push({ title: name, price: price, link: link });
            localStorage.setItem('tech_cart', JSON.stringify(cart));
            alert(`${name} foi salvo com sucesso no carrinho!`);
        }
    </script>
</body>
</html>

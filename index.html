
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Tech</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

/* TOPO */
header {
    background: linear-gradient(135deg,#1e90ff,#007acc);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-top: 5px;
    font-size: 14px;
}

/* CATEGORIAS */
.categorias {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 10px;
}

.categorias button {
    border: none;
    background: white;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    padding: 10px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

/* BADGE */
.badge {
    position: absolute;
    background: red;
    color: white;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
}

/* TEXTO */
.nome {
    font-size: 16px;
    margin: 5px 0;
}

.preco-antigo {
    text-decoration: line-through;
    color: gray;
    font-size: 13px;
}

.preco {
    color: green;
    font-size: 18px;
    font-weight: bold;
}

/* BOTÃO */
.botao {
    display: block;
    background: linear-gradient(45deg,#00c853,#009624);
    color: white;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-top: 8px;
    text-decoration: none;
    font-weight: bold;
}

.botao:hover {
    transform: scale(1.05);
}
</style>
</head>

<body>

<header>
<h1>⚡ Nexa Tech</h1>
<p>Ofertas automáticas 🔥</p>
</header>

<div class="categorias">
<button>Todos</button>
<button>Fones</button>
<button>Streaming</button>
<button>TV</button>
<button>Informática</button>
<button>Smartwatch</button>
</div>

<div class="grid" id="produtos"></div>

<script>
const produtos = [
{
nome: "Fone Xiaomi Redmi Buds 6",
img: "https://i.ibb.co/G4wYwmCx/IMG-20260519-110430.jpg",
preco: "R$ 89,45",
antigo: "R$ 107,99",
link: "https://meli.la/2tPnubz"
},
{
nome: "Fire TV Stick 4K Max",
img: "https://i.ibb.co/8nnSh83B/IMG-20260519-110442.jpg",
preco: "R$ 375,00",
antigo: "R$ 399,00",
link: "https://meli.la/2k6FaAp"
},
{
nome: "Roku Streaming Stick",
img: "https://i.ibb.co/vvcB2wy0/IMG-20260519-110500.jpg",
preco: "R$ 258,30",
antigo: "R$ 309,90",
link: "https://meli.la/2u3Xm6U"
},
{
nome: "SSD Kingston 480GB",
img: "https://i.ibb.co/67cT968s/IMG-20260519-110513.jpg",
preco: "R$ 515,10",
antigo: "R$ 559,89",
link: "https://meli.la/1FWygjw"
}
];

const container = document.getElementById("produtos");

produtos.forEach(p => {
container.innerHTML += `
<div class="card">
<img src="${p.img}">
<div class="nome">${p.nome}</div>

<div class="preco-antigo">${p.antigo}</div>
<div class="preco">${p.preco}</div>

<p style="font-size:12px;color:#777;">⭐ 4.8 (120 avaliações)</p>
<p style="color:red;font-size:13px;">⚡ Últimas unidades!</p>

<a href="${p.link}" target="_blank" class="botao">
🔥 Garantir desconto agora
</a>
</div>
`;
});
</script>

</body>
</html>

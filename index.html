
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Tech</title>

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body {
  background:#f0f4f8;
}

header {
  background: linear-gradient(135deg,#1e90ff,#007acc);
  color:white;
  text-align:center;
  padding:40px 20px;
}

header h1 {
  font-size:28px;
}

.container {
  padding:20px;
  max-width:1200px;
  margin:auto;
}

.products-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;
}

/* CARD PROFISSIONAL */
.product-card {
  background:white;
  border-radius:18px;
  padding:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
  transition:0.3s;
  position:relative;
  overflow:hidden;
}

.product-card:hover {
  transform:translateY(-6px);
}

/* BADGE */
.badge {
  position:absolute;
  top:10px;
  left:10px;
  background:#ff4757;
  color:white;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

/* IMAGEM */
.product-image img {
  width:100%;
  height:180px;
  object-fit:contain;
}

/* TITULO */
h3 {
  font-size:14px;
  margin:10px 0;
  min-height:38px;
}

/* PREÇOS */
.old-price {
  text-decoration:line-through;
  color:#999;
  font-size:12px;
}

.current-price {
  color:#00a650;
  font-size:20px;
  font-weight:bold;
}

.discount {
  background:#e6f7ed;
  color:#00a650;
  font-size:12px;
  padding:3px 6px;
  border-radius:6px;
  margin-left:5px;
}

/* BOTÃO PRO */
.btn-oferta {
  display:block;
  background:linear-gradient(135deg,#00c853,#00a650);
  color:white;
  text-align:center;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
  transition:0.2s;
}

.btn-oferta:hover {
  transform:scale(1.05);
  box-shadow:0 5px 15px rgba(0,200,83,0.4);
}

/* EFEITO PULSANDO */
.btn-oferta {
  animation:pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform:scale(1); }
  50% { transform:scale(1.05); }
  100% { transform:scale(1); }
}

</style>
</head>

<body>

<header>
<h1>⚡ Nexa Tech</h1>
<p>Ofertas atualizadas automaticamente 🔥</p>
</header>

<div class="container">
<div class="products-grid" id="productsGrid"></div>
</div>

<script>

const products = [
{
title:"Fone Xiaomi Redmi Buds 6",
price:"R$ 89,45",
oldPrice:"R$ 107,99",
discount:"17% OFF",
img:"https://i.ibb.co/G4wYwmCx/IMG-20260519-110430.jpg",
link:"https://meli.la/2tPnubz",
badge:"Fone"
},
{
title:"Fire TV Stick 4K Max",
price:"R$ 375,00",
oldPrice:"R$ 399,00",
discount:"Promoção",
img:"https://i.ibb.co/8nnSh83B/IMG-20260519-110442.jpg",
link:"https://meli.la/2k6FaAp",
badge:"Streaming"
},
{
title:"Roku Streaming Stick",
price:"R$ 258,30",
oldPrice:"R$ 309,90",
discount:"16% OFF",
img:"https://i.ibb.co/vvcB2wy0/IMG-20260519-110500.jpg",
link:"https://meli.la/2u3Xm6U",
badge:"TV"
},
{
title:"SSD Kingston 480GB",
price:"R$ 515,10",
oldPrice:"R$ 559,89",
discount:"7% OFF",
img:"https://i.ibb.co/67cT968s/IMG-20260519-110513.jpg",
link:"https://meli.la/1FWygjw",
badge:"Informática"
},
{
title:"Mi Band 10",
price:"R$ 288,07",
oldPrice:"R$ 479,00",
discount:"39% OFF",
img:"https://i.ibb.co/W4b3N6XT/IMG-20260519-110528.jpg",
link:"https://meli.la/34mZxTS",
badge:"Smartwatch"
}
];

const grid = document.getElementById("productsGrid");

function loadProducts(){
grid.innerHTML = "";

products.forEach(p=>{
grid.innerHTML += `
<div class="product-card">

<span class="badge">${p.badge}</span>

<div class="product-image">
<img src="${p.img}">
</div>

<h3>${p.title}</h3>

<div class="old-price">${p.oldPrice}</div>

<div class="current-price">
${p.price}
<span class="discount">${p.discount}</span>
</div>

<a href="${p.link}" target="_blank" class="btn-oferta">
🔥 Garantir Desconto
</a>

</div>
`;
});
}

loadProducts();

</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Tech - Lançamentos e Achados</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
body { background-color: #f0f4f8; color: #333; padding-bottom: 40px; }

header { background: linear-gradient(135deg, #1e90ff, #007acc); color: white; text-align: center; padding: 40px 20px; }

/* GRID */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
  padding: 20px;
}

.product-card {
  background: #fff;
  border-radius: 15px;
  padding: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.product-image img {
  width: 100%;
}

.product-info h3 {
  font-size: 14px;
  margin: 10px 0;
}

.current-price {
  color: green;
  font-weight: bold;
  font-size: 18px;
}

.btn-oferta {
  display: block;
  background: #00a650;
  color: #fff;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  margin-top: 10px;
  text-decoration: none;
}
</style>
</head>

<body>

<header>
<h1>⚡ Nexa Tech</h1>
<p>Produtos atualizados automaticamente 🔥</p>
</header>

<!-- PRODUTOS AUTOMÁTICOS -->
<div class="products-grid" id="productsGrid"></div>

<script>
async function carregarProdutos() {
  const grid = document.getElementById("productsGrid");

  try {
    const resposta = await fetch("produtos.json");
    const produtos = await resposta.json();

    grid.innerHTML = "";

    produtos.forEach(p => {
      grid.innerHTML += `
        <div class="product-card">
          <div class="product-image">
            <img src="${p.imagem}">
          </div>

          <div class="product-info">
            <h3>${p.nome}</h3>
            <div class="current-price">R$ ${p.preco}</div>

            <a href="${p.link}" target="_blank" class="btn-oferta">
              Garantir Desconto
            </a>
          </div>
        </div>
      `;
    });

  } catch (erro) {
    grid.innerHTML = "Erro ao carregar produtos 😢";
    console.error(erro);
  }
}

carregarProdutos();
</script>

</body>
</html>

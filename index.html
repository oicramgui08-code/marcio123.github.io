<!DOCTYPE html>
<html lang="pt-BR">
<head>

<!-- SEO GOOGLE -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nexa Tech | Ofertas Baratas e Produtos em Promoção</title>

<meta name="description" content="Encontre fones Bluetooth, smartwatches e eletrônicos com desconto direto do Mercado Livre. Ofertas atualizadas todos os dias!">

<meta name="keywords" content="ofertas, promoção, fone bluetooth barato, smartwatch barato, mercado livre ofertas">

<meta name="author" content="Nexa Tech">

<!-- GOOGLE SEARCH VERIFICATION -->
<meta name="google-site-verification" content="COLE_AQUI_SEU_CODIGO_DO_GOOGLE" />

<!-- SOCIAL (aparece bonito quando compartilhar) -->
<meta property="og:title" content="🔥 Ofertas Baratas - Nexa Tech">
<meta property="og:description" content="Veja produtos baratos com desconto real. Clique antes que acabe!">
<meta property="og:image" content="https://i.ibb.co/G4wYwmCx/IMG-20260519-110430.jpg">
<meta property="og:type" content="website">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
}

/* HEADER */
header {
    background: linear-gradient(135deg,#1e90ff,#007acc);
    color: white;
    text-align: center;
    padding: 30px 15px;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

header p {
    margin-top: 5px;
    font-size: 14px;
}

/* BARRA DE CONFIANÇA */
.trust {
    text-align: center;
    font-size: 13px;
    padding: 8px;
    background: white;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 15px;
    padding: 15px;
}

/* CARD */
.card {
    background: white;
    border-radius: 15px;
    padding: 10px;
    box-shadow: 0 6px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* IMG */
.card img {
    width: 100%;
    height: 180px;
    object-fit: contain;
}

/* TEXTO */
.nome {
    font-size: 15px;
    margin: 5px 0;
}

.old {
    text-decoration: line-through;
    color: gray;
    font-size: 13px;
}

.price {
    color: #00a650;
    font-size: 18px;
    font-weight: bold;
}

/* BOTÃO */
.btn {
    display: block;
    background: linear-gradient(45deg,#00c853,#009624);
    color: white;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    margin-top: 8px;
    text-decoration: none;
    font-weight: bold;
}

/* URGÊNCIA */
.urgencia {
    color: red;
    font-size: 13px;
}

/* PROVA SOCIAL */
.social {
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<header>
<h1>⚡ Nexa Tech</h1>
<p>Ofertas baratas atualizadas todos os dias 🔥</p>
</header>

<div class="trust">
🚚 Envio rápido | 🔒 Compra segura | 💥 Promoções reais
</div>

<div class="grid" id="produtos"></div>

<script>
const produtos = [
{
nome: "Fone Xiaomi Redmi Buds 6",
img: "https://i.ibb.co/G4wYwmCx/IMG-20260519-110430.jpg",
old: "R$ 107,99",
price: "R$ 89,45",
link: "https://meli.la/2tPnubz"
},
{
nome: "Fire TV Stick 4K Max",
img: "https://i.ibb.co/8nnSh83B/IMG-20260519-110442.jpg",
old: "R$ 399,00",
price: "R$ 375,00",
link: "https://meli.la/2k6FaAp"
},
{
nome: "Roku Streaming Stick",
img: "https://i.ibb.co/vvcB2wy0/IMG-20260519-110500.jpg",
old: "R$ 309,90",
price: "R$ 258,30",
link: "https://meli.la/2u3Xm6U"
},
{
nome: "SSD Kingston 480GB",
img: "https://i.ibb.co/67cT968s/IMG-20260519-110513.jpg",
old: "R$ 559,89",
price: "R$ 515,10",
link: "https://meli.la/1FWygjw"
}
];

const container = document.getElementById("produtos");

produtos.forEach(p => {
container.innerHTML += `
<div class="card">
<img src="${p.img}">

<div class="nome">${p.nome}</div>

<div class="old">${p.old}</div>
<div class="price">${p.price}</div>

<p class="social">⭐ 4.8 (120 avaliações)</p>
<p class="urgencia">⚡ Últimas unidades!</p>

<a href="${p.link}" target="_blank" class="btn">
🔥 Garantir desconto agora
</a>

</div>
`;
});
</script>

</body>
</html>

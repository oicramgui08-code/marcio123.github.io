<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Carrinho - Tech Ofertas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f4f8; color: #333; padding: 20px; }
        .container { max-width: 600px; margin: 50px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        h1 { color: #00a650; margin-bottom: 20px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #e1e8ed; }
        .cart-item-title { font-weight: 600; font-size: 1rem; }
        .cart-item-price { color: #00a650; font-weight: bold; }
        .btn-comprar { color: #007acc; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .btn-remove { background: none; border: none; color: #ff4757; cursor: pointer; font-size: 1rem; }
        .btn-voltar { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #333; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Meus Itens Salvos</h1>
        <div id="cartItemsContainer"></div>
        <a href="index.html" class="btn-voltar">🏠 Continuar Navegando</a>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('tech_cart')) || [];
        const container = document.getElementById('cartItemsContainer');

        function renderCart() {
            container.innerHTML = '';
            if(cart.length === 0) {
                container.innerHTML = '<p style="color: #888; text-align:center; padding: 20px;">Seu carrinho está vazio.</p>';
                return;
            }
            cart.forEach((item, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div>
                        <div class="cart-item-title">${item.title}</div>
                        <div class="cart-item-price">${item.price}</div>
                    </div>
                    <div style="display:flex; gap: 15px; align-items:center;">
                        <a href="${item.link}" target="_blank" class="btn-comprar">Comprar</a>
                        <button class="btn-remove" onclick="removeFromCart(${index})">❌</button>
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            localStorage.setItem('tech_cart', JSON.stringify(cart));
            renderCart();
        }

        renderCart();
    </script>
</body>
</html>
